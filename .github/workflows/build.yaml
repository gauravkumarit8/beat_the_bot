name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffold (only if android/ is missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.grv --project-name beat_the_bot /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Patch AndroidManifest and Gradle (safe to repeat)
        run: |
          python3 tools/patch_android.py
          python3 tools/patch_desugaring.py

      - name: Commit Android changes back to the repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain android)" ]; then
            git add -f android
            git commit -m "chore: update generated Android project"
            git push || echo "Push skipped"
          fi

      # Gradle's plugin portal mirror sometimes lacks Kotlin artifacts that exist
      # on Maven Central. This makes Gradle look at Maven Central first for plugins.
      - name: Prefer Maven Central for Gradle plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-first.gradle <<'GRADLE'
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              maven { url = uri('https://repo.maven.apache.org/maven2') }
              gradlePluginPortal()
            }
          }
          GRADLE

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      # If a test fails, put the useful part on the run's Summary page.
      - name: Show test failure details
        if: failure()
        run: |
          {
            echo '### Test failure details'
            echo '```'
            grep -n -B3 -A25 'EXCEPTION CAUGHT\|Expected:\|\[E\]' test.log | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
