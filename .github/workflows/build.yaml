name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # You cannot run `flutter create` locally, so CI generates the Android
      # project once and uploads it as an artifact for you to commit.
      - name: Generate Android scaffold (only if android/ is missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.grv --project-name beat_the_bot /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android scaffold
        uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: android/
          retention-days: 7
