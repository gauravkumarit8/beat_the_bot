name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android scaffold (only if android/ is missing)
        id: scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.grv --project-name beat_the_bot /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android scaffold
        if: steps.scaffold.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: android/
          retention-days: 7

      - name: Commit generated Android project to the repo
        if: steps.scaffold.outputs.generated == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android
          git commit -m "chore: add generated Android project" || echo "Nothing to commit"
          git push || echo "Push skipped"

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk